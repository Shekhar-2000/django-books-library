{% extends 'books/base.html' %}
{% block content %}
<h1>Books</h1>
<a class="btn" href="{% url 'book_create' %}">+ Add Book</a>
<table>
    <tr><th>Title</th><th>Author</th><th>Price</th><th>Actions</th></tr>
    {% for book in books %}
    <tr>
        <td><a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a></td>
        <td>{{ book.author }}</td>
        <td>{{ book.price }}</td>
        <td>
            <a class="btn" href="{% url 'book_update' book.pk %}">Edit</a>
            <a class="btn danger" href="{% url 'book_delete' book.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No books yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
